<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DSH Desktop Pure simplified monochrome icon</title>
  <desc id="desc">A bold letter P containing a simplified whale in negative space.</desc>
  <defs>
    <mask id="whale" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>

      <!-- Simplified whale body. -->
      <path d="M204 207c0-55 42-94 101-94 34 0 62 13 80 35 14 18 22 42 21 68-3 52-43 89-98 89-58 0-96-37-103-88-1-3-1-7-1-10Z" fill="#000"/>

      <!-- Two oversized tail lobes joined to the body. -->
      <path d="M374 160c13-19 30-32 50-37-2 23-10 40-24 54 14 6 25 17 32 32-20-1-36-7-48-19l-10-30Z" fill="#000"/>

      <!-- Bold belly/mouth counter, designed to survive at 16 px. -->
      <path d="M229 203c30-3 62 12 88 43 17 21 33 35 50 42-18 11-40 16-61 13-38-5-68-31-77-67-3-12-3-22 0-31Z" fill="#fff"/>

      <!-- Oversized eye for taskbar-scale legibility. -->
      <circle cx="278" cy="181" r="13" fill="#fff"/>
    </mask>
  </defs>

  <!-- One foreground color. Use CSS color to recolor; background stays transparent. -->
  <path d="M104 464V80c0-22 18-40 40-40h137c107 0 175 62 175 164 0 103-68 164-175 164h-65v96H104Z" fill="currentColor" mask="url(#whale)"/>
</svg>
