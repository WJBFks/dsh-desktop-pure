<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>menu</title>
  <style>
    /* Theme: follows prefers-color-scheme (driven by nativeTheme.themeSource). */
    :root {
      --menu-bg: #1f2937;
      --menu-fg: #e5e7eb;
      --menu-fg-dim: #9ca3af;
      --menu-hover: #2d3a4f;
      --menu-radio: #60a5fa;
      --menu-sep: #374151;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --menu-bg: #ffffff;
        --menu-fg: #1f2937;
        --menu-fg-dim: #6b7280;
        --menu-hover: #eef2ff;
        --menu-radio: #2563eb;
        --menu-sep: #e5e7eb;
      }
    }

    html,
    body {
      margin: 0;
      height: 100%;
      /* Transparent: only #menu is painted; the rest shows the harness below. */
      background: transparent;
      color: var(--menu-fg);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      font-size: 12px;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #menu {
      /* The view bounds (main.js openMenuAt) extend 12px beyond this box to
         the left/right and below to hold the drop shadow: the box is placed
         at (12,0), flush with the view top, and is exactly the content. */
      position: absolute;
      left: 12px;
      top: 0;
      width: calc(100% - 24px);
      height: calc(100% - 12px);
      box-sizing: border-box;
      background: var(--menu-bg);
      /* Top/bottom padding must equal MENU_PAD_V in main.js; item heights
         must equal MENU_ITEM_H / MENU_SEP_H so the box matches the content. */
      padding: 8px 12px 8px;
      border-radius: 10px;
      /* Zero offset, uniform blur on all sides. */
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.28), 0 0 3px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .dd-item {
      display: flex;
      align-items: center;
      height: 30px;
      padding: 0 14px 0 10px;
      box-sizing: border-box;
      cursor: default;
      color: var(--menu-fg);
      white-space: nowrap;
    }
    .dd-item:hover {
      background: var(--menu-hover);
    }
    .dd-item.disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    .dd-prefix {
      width: 16px;
      flex: 0 0 auto;
      text-align: center;
      color: var(--menu-radio);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Gray group heading (e.g. "DSH Web" above the endpoint list) */
    .dd-item.heading {
      color: var(--menu-fg-dim);
      font-size: 11px;
      cursor: default;
      padding-left: 0;
    }
    .dd-item.heading:hover {
      background: transparent;
    }
    /* Currently-shown endpoint: persistent highlight */
    .dd-item.active {
      background: var(--menu-hover);
      font-weight: 600;
    }
    /* Endpoint connection-status dot */
    .dd-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      background: var(--menu-fg-dim);
    }
    .dd-dot.online {
      background: #22c55e;
    }
    .dd-dot.starting {
      background: #f59e0b;
    }
    /* 红 = 连接过后来断开/出错；灰（默认色）= 从未连接过（unknown） */
    .dd-dot.error,
    .dd-dot.offline {
      background: #f25a5a;
    }
    .dd-label {
      flex: 1 1 auto;
      margin-left: 2px;
    }
    .dd-acc {
      flex: 0 0 auto;
      margin-left: 24px;
      color: var(--menu-fg-dim);
    }
    .dd-sep {
      height: 9px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
    }
    .dd-sep::before {
      content: "";
      width: 100%;
      height: 1px;
      background: var(--menu-sep);
    }
  </style>
</head>
<body>
  <div id="menu"></div>
  <script>
    (function () {
      var menuEl = document.getElementById('menu');
      var api = window.dshMenu;

      function clear() {
        menuEl.innerHTML = '';
      }

      function render(data) {
        if (!data || !Array.isArray(data.items)) return;
        clear();
        data.items.forEach(function (it) {
          if (!it) return;
          if (it.type === 'separator') {
            var sep = document.createElement('div');
            sep.className = 'dd-sep';
            menuEl.appendChild(sep);
            return;
          }
          var row = document.createElement('div');
          row.className = 'dd-item';
          if (it.type === 'heading') row.className += ' heading';
          if (it.enabled === false) row.className += ' disabled';
          if (it.active) row.className += ' active';

          var prefix = document.createElement('span');
          prefix.className = 'dd-prefix';
          if (it.type === 'radio' && it.checked) prefix.textContent = '●';
          if (it.type === 'status') {
            var dot = document.createElement('span');
            dot.className = 'dd-dot ' + (it.status || 'unknown');
            prefix.appendChild(dot);
          }
          row.appendChild(prefix);

          var lab = document.createElement('span');
          lab.className = 'dd-label';
          lab.textContent = it.label || '';
          row.appendChild(lab);

          if (it.accelerator) {
            var acc = document.createElement('span');
            acc.className = 'dd-acc';
            acc.textContent = it.accelerator;
            row.appendChild(acc);
          }

          if (it.type !== 'heading' && it.enabled !== false && it.id) {
            row.addEventListener('click', function (e) {
              e.stopPropagation();
              if (api) api.action(it.id);
            });
          }
          menuEl.appendChild(row);
        });
      }

      if (api) {
        api.onShow(render);
        api.onHide(clear);
      }

      // Click anywhere that is not a menu item (the box padding, or the
      // transparent shadow margin the view extends into) -> dismiss.
      document.body.addEventListener('click', function (e) {
        if (api && !e.target.closest('.dd-item')) api.close();
      });

      // Escape dismisses (when this view has focus).
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && api) api.close();
      });
    })();
  </script>
</body>
</html>
