<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>loading</title>
  <style>
    /* Theme-aware: follows prefers-color-scheme (driven by nativeTheme). */
    :root {
      --bg: #111827;
      --fg: #d1d5db;
      --fg-dim: #9ca3af;
      --accent: #60a5fa;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f4f6;
        --fg: #374151;
        --fg-dim: #6b7280;
        --accent: #2563eb;
      }
    }
    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(128, 128, 128, 0.22);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .text {
      font-size: 13px;
      color: var(--fg);
    }
    .sub {
      font-size: 12px;
      color: var(--fg-dim);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div class="text">正在重启 dsh 服务器…</div>
    <div class="sub">请稍候，页面将在服务器就绪后自动刷新</div>
  </div>
</body>
</html>
